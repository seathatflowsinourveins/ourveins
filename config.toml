# ------------------------------------------------------------------
# Project trust
# ------------------------------------------------------------------
[projects.'z:\claude-sota-installed']
trust_level = "trusted"

[projects.'z:\repos\deps']
trust_level = "trusted"

[projects.'z:\repos\deps\cwc-long-running-agents']
trust_level = "trusted"

[projects.'z:\claude-sota-installed\.claude\plugins\marketplaces\addy-agent-skills']
trust_level = "trusted"

[projects.'z:\claude-sota-pure']
trust_level = "trusted"

# ------------------------------------------------------------------
# Windows sandbox — `unelevated` avoids Win32 1326 logon-failure that `elevated` triggers without DPAPI sandbox accounts.
# Cite: openai/codex@a2db6f97f codex-rs/windows-sandbox-rs/src/spawn_prep.rs:259-328 (RestrictedToken path).
# ------------------------------------------------------------------
[windows]
sandbox = "unelevated"

# ------------------------------------------------------------------
# Sandbox workspace-write
# Wave 89 Ship 1Y CR-7 graduated-unleash: network_access true for SOTA repo discovery
# (Anthropic /api/oauth/usage + ChatGPT /backend-api/wham/usage polling + WebFetch).
# Cite: codex-rs/core/src/config/config_tests.rs:1438,1572 @ HEAD 993e3f407ea8213f7d32cb9367ae7616b7e15b4a
# ------------------------------------------------------------------
[sandbox_workspace_write]
writable_roots = ["Z:/claude-sota-installed", "Z:/repos/deps", "Z:/claude-sota-installed-state"]
network_access = true
exclude_slash_tmp = false
exclude_tmpdir_env_var = false

# ------------------------------------------------------------------
# Profiles — `codex exec -p <name>` applies the bundled overrides.
#
# `deep-review-exec` is the EXACT profile name expected by the cardinal-rule-3 hook chain:
#   - .claude/hooks/scripts/codex_t1_consult_gate.py (PreToolUse:Edit)
#   - .claude/hooks/scripts/codex_t2_pre_commit_gate.py (PreToolUse:Bash git commit)
#   - .claude/hooks/scripts/codex_postcommit_review.py (PostToolUse:Bash)
#   - .claude/hooks/scripts/codex_prepush_review.py (PostToolUse:Bash git push)
#   - .claude/plugins/marketplaces/openai-codex/plugins/codex/scripts/stop-review-gate-hook.mjs (Stop)
#
# Without this profile defined, the gate falls to WARN-mode (decision: warn_t1_missing) and provides ZERO actual review.
# ------------------------------------------------------------------

# Wave 89 Ship 1Y 2026-05-08 — CR-7 graduated-unleash per user directive
# "codex and all sandbox must be unleashed, full premision with sota harness references".
# All 3 profiles flipped sandbox_mode: read-only -> danger-full-access.
# TIER-1-DIRECT cite chain (verbatim syntax verification):
#   - codex-rs/core/src/config/config_tests.rs:1438,1572 @ HEAD 993e3f40
#     verbatim string `sandbox_mode = "danger-full-access"` in upstream tests
#   - codex-rs/core/src/config/config_tests.rs:842 @ HEAD 993e3f40
#     `&SandboxPolicy::DangerFullAccess` enum variant
#   - codex-rs/core/config.schema.json:255-257 @ HEAD 993e3f40
#     approval_policy = "never" verbatim "Never ask the user to approve commands"
# Wave 87+88 evidence: read-only blocked PowerShell/sqlite3/git/web search probes,
# leading to Pattern B HNF on terminal verdicts. danger-full-access lifts the gate
# while preserving CC-side safety floor (safety_guard.py + agent_plan_readonly_bash_guard.py
# + permissions.deny[] for secrets per Wave 75 baseline).

[profiles.deep-review-exec]
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
sandbox_mode = "danger-full-access"
approval_policy = "never"
plan_mode_reasoning_effort = "xhigh"
service_tier = "fast"

[profiles.review]
model = "gpt-5.5"
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"
sandbox_mode = "danger-full-access"
approval_policy = "never"

[profiles.headless-exec]
model = "gpt-5.4"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
sandbox_mode = "danger-full-access"
approval_policy = "never"

# ------------------------------------------------------------------
# Features
# ------------------------------------------------------------------
[features]
multi_agent = true
# Wave 83b 2026-05-08 — `codex_hooks` deprecated → renamed to `hooks` per
# Z:/repos/deps/codex/codex-rs/features/src/tests.rs `codex_hooks_is_legacy_alias_for_hooks`
