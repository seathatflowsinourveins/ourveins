# Codex config.toml — Z:\claude-sota-installed runtime (Wave 75 2026-05-08)
#
# Cite anchors (TIER-1-DIRECT to openai/codex):
#   - codex-rs/core/config.schema.json — profile/sandbox/projects schema
#   - codex-rs/windows-sandbox-rs/src/spawn_prep.rs — Win32 RestrictedToken sandbox path
#   - openai/codex README.md — `codex exec -p <profile>` invocation surface
#
# Cite-import-AMBER (CR-12 fallback path C with sibling-bleed defense per CR-9):
#   - Adapted from Z:\claude-sota-state\.codex\config.toml (sibling) with PATH-REWRITE for claude-sota-installed runtime context.
#   - Removed sibling-specific [agents.*] (paths to C:/Users/42/.codex/agents/*.toml not in this runtime's scope)
