$schema: https://raw.githubusercontent.com/ComposioHQ/agent-orchestrator/main/schema/config.schema.json

# ── Top-level settings ──────────────────────────────────────────────
port: 3000
readyThresholdMs: 300000

observability:
  logLevel: info
  stderr: false

# ── Defaults ────────────────────────────────────────────────────────
defaults:
  runtime: tmux
  agent: claude-code
  workspace: worktree
  notifiers:
    - desktop

# ── Projects ────────────────────────────────────────────────────────
projects:
  claude-sota-installed:
    name: claude-sota-installed
    repo: seathatflowsinourveins/myvein
    path: Z:/claude-sota-installed
    defaultBranch: main
    sessionPrefix: csi

    agent: claude-code
