name: Feature Request
description: Propose a new primitive / plugin / MCP / skill / workflow addition
labels: ["enhancement", "triage"]
title: "[FEAT] "

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

        Per CR-1 (W331 axis-1 #3): new install candidates must clear trust-tuple — SLSA-L3/npm-provenance/Sigstore + license MIT/Apache/BSD/ISC/MPL + commit-age + blast-radius.

  - type: dropdown
    id: layer
    attributes:
      label: Architecture layer
      options:
        - Plugin (new marketplace install)
        - MCP server (new .mcp.json entry)
        - Skill (new operator-curated SKILL.md OR vendor-fork)
        - Workflow (new .github/workflows/)
        - Hook (new sanctioned ≤2KB hook)
        - Tools/ guard (CR-5 exception)
        - Documentation / wave-architecture
        - Other
    validations: { required: true }

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What gap does it close?
    validations: { required: true }

  - type: textarea
    id: cite-anchor
    attributes:
      label: Cite-anchor (3-org-distinct preferred)
      description: Per Meta-Invariant I1 — at least 1 cite, 3+ org-distinct preferred for T1 INSTALL
      placeholder: |
        1. Anthropic / claude-cookbooks @ <SHA>
        2. NIST SP 800-218 PW.7
        3. OWASP CICD-SEC-N
    validations: { required: true }

  - type: dropdown
    id: tier
    attributes:
      label: Proposed sca-v13 tier
      options:
        - T0 IMMEDIATE-UPGRADE (replaces incumbent)
        - T1 INSTALL (full adoption)
        - T1-PROVISIONAL (24h re-cascade SLA)
        - T2 VENDOR-FORK (license incompat)
        - T2-CHERRY-FRONTIER (Pareto-frontier)
        - T2-CHERRY (per-component)
        - T3 PATTERN-STUDY
        - T4 CITE-ONLY
    validations: { required: true }

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What incumbent does this replace/complement? Rejected candidates?

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria (R6 verify-before-claim)
      description: How will we know this is shipped?
      placeholder: |
        - [ ] D-EMP smoke-test passes
        - [ ] codex GPT-5.5 round-1 APPROVE
        - [ ] CI green
    validations: { required: true }

  - type: textarea
    id: rollback
    attributes:
      label: Rollback plan
    validations: { required: true }
