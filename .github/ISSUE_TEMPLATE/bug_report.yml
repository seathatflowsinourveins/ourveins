name: Bug Report
description: Report a defect in claude-sota-installed (runtime, plugin, MCP, hook, skill, or workflow)
labels: ["bug", "triage"]
title: "[BUG] "

body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Per R6 verify-before-claim — please provide an independently-reproducible probe (test exit code, command stdout, stack trace).

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - Plugin (.claude/plugins/)
        - MCP server (.mcp.json)
        - Hook (.claude/hooks/ OR tools/preagent-*)
        - Skill (.claude/skills/)
        - Slash command (.claude/commands/)
        - Workflow (.github/workflows/)
        - Cardinal-rule discipline (CLAUDE.md)
        - sca-v13 framework
        - Other
    validations: { required: true }

  - type: textarea
    id: repro
    attributes:
      label: Reproduction (paste-ready)
      description: Exact commands + expected output + actual output
      placeholder: |
        $ command here
        # expected: ...
        # actual: ...
      render: bash
    validations: { required: true }

  - type: textarea
    id: probe
    attributes:
      label: Independent probe (R6)
      description: Test exit code / SHA / codex verdict / operator-acceptance — verify-before-claim
    validations: { required: true }

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Node 22.22.0 / Python 3.13 / Windows 11 Pro Z:-portable"
    validations: { required: true }

  - type: textarea
    id: cite
    attributes:
      label: Wave-cite (if applicable)
      placeholder: docs/architecture/W___/...

  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight
      options:
        - label: I checked existing issues for duplicates
          required: true
        - label: I verified .gitignore-correct (no secrets leaked in repro)
          required: true
