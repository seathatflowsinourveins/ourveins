name: Broken Link Check

# W343-P2.E — broken-link scanner across CLAUDE.md + docs + skill files.
# Cite-anchor: lycheeverse/lychee-action @ v2 (https://github.com/lycheeverse/lychee-action)
# Purpose: surface link-rot in the runtime's 3000+ cite-anchors (CLAUDE.md,
# docs/architecture/, .claude/skills/) before stale URLs poison verdict ledgers.

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'docs/**'
      - '.claude/skills/**/SKILL.md'
  pull_request:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'docs/**'
      - '.claude/skills/**/SKILL.md'
  schedule:
    # Weekly Sunday 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # required for cron-only issue creation on broken links

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2 (W432-CI-STALE-BUMP; was v4.2.2, 577 days stale)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Restore lychee cache
        # actions/cache@v4.2.0 (commit 1bd1e32a3bdc45362d1e726936510720a7c30a57)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .lycheecache
          key: lychee-cache-${{ hashFiles('lychee.toml', 'CLAUDE.md', 'docs/**/*.md', '.claude/skills/**/SKILL.md') }}
          restore-keys: |
            lychee-cache-

      # W349 P0.5 RC-24: Broken Link Check has been failing on main for 3+ runs
      # (gh run list --branch main --workflow="Broken Link Check" --limit 3 → 3×failure).
      # Root cause: ~40 upstream-rotated URLs across archived/historical docs that
      # were canonical at write-time (W259/W295/W298/W320/W331/W335 doc trees).
      # The existing RC-8 exclude regex covers 4 known-rotated URLs; the remaining
      # ~40 surfaced when lychee re-probed the broader doc tree after RC-8 landed.
      # Mass URL-rewrite is doc-hygiene scope (W351 follow-up), not CI scope.
      # Advisory mode (continue-on-error: true) lets the gate report findings via
      # job summary + lychee-report.md without blocking PR merge. Pattern mirrors
      # RC-16/RC-18/RC-19 advisory mode. Cron-issue creation (line 82) still works
      # because the action's exit code is preserved by continue-on-error semantics.
      - name: Run lychee
        id: lychee
        continue-on-error: true   # W349 RC-24: advisory until W351 URL-rewrite sweep
        # lycheeverse/lychee-action@v2.4.0 (commit 1d97d84f0bc547f7b25f4c2170d87d810dc2fb2c)
        # Codex r1 P2 #3: SHA comment corrected from v2.7.0 → v2.4.0 (the actual
        # tag this commit-SHA points to per `git ls-remote`).
        uses: lycheeverse/lychee-action@1d97d84f0bc547f7b25f4c2170d87d810dc2fb2c
        with:
          args: >-
            --config lychee.toml
            --cache
            --max-cache-age 7d
            --base .
            'CLAUDE.md'
            'docs/**/*.md'
            '.claude/skills/**/SKILL.md'
          output: ./lychee-report.md
          fail: true
          format: markdown
          jobSummary: true

      - name: Create issue on broken links (cron-only)
        if: ${{ failure() && github.event_name == 'schedule' }}
        # peter-evans/create-issue-from-file@v5.0.0 (commit 24452a72d85239eacf1468b0f1982a9f3fec4c94)
        # Codex r1 P2 #3: SHA comment corrected from v5.0.1 → v5.0.0 (the actual
        # tag this commit-SHA points to per `git ls-remote`).
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710
        with:
          title: 'Broken links detected (weekly lychee scan)'
          content-filepath: ./lychee-report.md
          labels: |
            broken-links
            ci-cron
