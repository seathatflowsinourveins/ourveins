name: Monthly metrics roll-up
on:
  schedule:
    - cron: '0 9 1 * *'   # 1st of month, 09:00 UTC
  workflow_dispatch:

# Per W342 Stream X4 §1 (P1.3 ECC port): monthly parallel-ratio + sca-v15 verdict summary
# Source: W341 Stream D §5 (everything-claude-code CI templates)
# Anthropic ref: https://docs.anthropic.com/en/docs/claude-code/github-actions

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    name: Roll-up metrics + open summary issue
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2 (W347 P4b SHA-pin, codex r1 corrected refs/tags/v2)
        with: { egress-policy: audit }

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (W432-CI-STALE-BUMP; was v4.3.1, 191 days stale)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (W347 P4b SHA-pin)
        with: { node-version: '22.22.0' }

      - name: Run parallel-ratio telemetry
        id: parallel
        run: |
          set -euo pipefail
          if [ -f tools/parallel-ratio-telemetry.mjs ]; then
            node tools/parallel-ratio-telemetry.mjs --since '30 days ago' \
              --output parallel-ratio.json || true
            cat parallel-ratio.json >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "parallel-ratio-telemetry.mjs not present — skip" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Count sca-v15 verdicts (last 30d)
        id: verdicts
        run: |
          set -euo pipefail
          count=$(git log --since='30 days ago' --grep='VERDICT' --oneline | wc -l || echo 0)
          echo "verdict_count=$count" >> "$GITHUB_OUTPUT"
          echo "## sca-v15 verdict count (last 30d): $count" >> "$GITHUB_STEP_SUMMARY"

      - name: Compose monthly issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (W432-CI-STALE-BUMP; was v7.1.0, 351 days stale — verified script uses injected github + Node-builtin fs only, no require('@actions/github'))
        with:
          script: |
            const fs = require('fs');
            let parallel = 'n/a';
            try { parallel = fs.readFileSync('parallel-ratio.json', 'utf8'); } catch (e) {}
            const verdicts = '${{ steps.verdicts.outputs.verdict_count }}';
            const date = new Date().toISOString().slice(0, 7);
            const body = `# Monthly metrics — ${date}\n\n## Parallel ratio\n\`\`\`json\n${parallel}\n\`\`\`\n\n## sca-v15 verdict count (last 30d)\n${verdicts}\n\n*Auto-generated by .github/workflows/monthly-metrics.yml*`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Monthly metrics — ${date}`,
              body: body,
              labels: ['metrics', 'auto-generated']
            });
