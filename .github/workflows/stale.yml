name: stale (issue + PR aging)
on:
  schedule:
    - cron: '30 1 * * *'   # daily 01:30 UTC
  workflow_dispatch:

# Per https://github.com/actions/stale
# Conservative settings: 180d stale + 30d close.

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }

      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639  # v9.1.0
        with:
          days-before-stale: 180
          days-before-close: 30

          stale-issue-message: |
            This issue has been auto-marked **stale** after 180 days of inactivity. It will be auto-closed in 30 days unless re-activated.
          close-issue-message: |
            Auto-closing after 210 days inactive. Re-open if the work is still relevant.

          stale-pr-message: |
            This PR has been auto-marked **stale** after 180 days of inactivity. It will be auto-closed in 30 days unless re-activated.
          close-pr-message: |
            Auto-closing after 210 days inactive. Re-open and rebase to wake.

          stale-issue-label: stale
          stale-pr-label: stale

          exempt-issue-labels: 'pinned,security,bug,enhancement'
          exempt-pr-labels: 'WIP,dependencies,security'

          exempt-draft-pr: true
          operations-per-run: 60
          remove-stale-when-updated: true
          enable-statistics: true
