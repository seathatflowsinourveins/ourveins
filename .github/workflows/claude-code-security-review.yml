# RETIRED 2026-05-24 per W432-FINALIZE-spec §13 ADR v2 (Local-Only architecture).
# This workflow originally required ANTHROPIC_API_KEY for Anthropic-official security review on PRs.
# Replaced by: (a) local `codex exec` r1 review (ChatGPT Pro subscription auth) covering security
# patterns within the cross-model adversarial review pass; (b) gitleaks pre-commit hook + CodeQL
# workflow (.github/workflows/codeql.yml) for SAST coverage; (c) Scorecard + Zizmor workflows.
# Workflow retained for future re-enable if operator subscribes to Anthropic API + designates
# security-review as a dedicated CI gate (e.g. multi-committer threat-model shift per W432
# COPILOT-PROBE RESULT.md). Manual fire via workflow_dispatch supported for ad-hoc audits.
name: Claude Code Security Review (Anthropic-official) [RETIRED — workflow_dispatch only]
on:
  workflow_dispatch:  # MANUAL-ONLY per W432-AI-CI-RETIRE (A2 Local-Only architecture)

# Per https://github.com/anthropics/claude-code-security-review (4.6k+ stars, MIT, Anthropic-official)
# Security-focused PR review — complements codex GPT-5.5 (general adversarial review).
# CR-1(a) top-tier trust: Anthropic-published, MIT, npm-provenance via @anthropic-ai/* publisher.
#
# Different scope from .github/workflows/codex-review.yml:
#   - codex-review.yml = codex GPT-5.5 AUTHORITY for general adversarial review (W331 P0.7)
#   - claude-code-security-review.yml = SECURITY-focused review (CWE / OWASP / secret patterns)
# No conflict: both run, both must pass; codex remains the AUTHORITY on review verdicts.

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: claude-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: Claude Code Security Review
    runs-on: ubuntu-latest
    if: |
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-security-review') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4 (W436-GH-PRACTICE-INSTALL bump 2026-05-24; Enterprise-tier-only changelog, no behavioral delta)
        with: { egress-policy: audit }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (W432-CI-STALE-BUMP; was v4.3.1, 191 days stale)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Claude Code Security Review
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda  # main HEAD at 2026-05-20 (W351 P2 codex-r1 highest-risk pin)
        with:
          # W432 G0 fix 2026-05-24: action.yml at pinned SHA defines input as `claude-api-key`
          # (with hyphens), NOT `claude_api_key` (underscores). Underscore form was rejected
          # by composite-action input validation → ANTHROPIC_API_KEY env unset → exit 1 with
          # error "ANTHROPIC_API_KEY is not set. Please provide the claude-api-key input".
          # Cite: anthropics/claude-code-security-review action.yml @ 0c6a49f1 line `claude-api-key:`
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          upload-results: true
          # Focus on additive security gaps, not codex's general review
          # (codex-review.yml retains W331 P0.7 AUTHORITY on overall verdict)
