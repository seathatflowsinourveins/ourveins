name: SLSA L3 provenance (wave-closure tags)
on:
  push:
    tags:
      - 'W*-ship-*'    # e.g., W332-ship-2026-05-19
      - 'W*-closure-*' # e.g., W331-closure-2026-05-19

permissions:
  id-token: write
  contents: write
  actions: read

# Per https://slsa.dev/spec/v1.0/levels#build-l3 + https://github.com/slsa-framework/slsa-github-generator
# Closes R1 trust-tuple (W331 axis-1 #3) via build-provenance attestation for wave-closure artifacts.

jobs:
  build-hashes:
    name: Compute hashes for VERDICT-LEDGER + WAVE-CLOSURE artifacts
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      wave_id: ${{ steps.tag.outputs.wave_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (W432-CI-STALE-BUMP; was v4.3.1, 191 days stale)
        with: { fetch-depth: 0, persist-credentials: false }

      - name: Extract wave-id from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          WAVE=$(echo "$TAG" | grep -oE 'W[0-9]+' | head -1)
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "wave_id=$WAVE" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 + base64 for wave artifacts
        id: hash
        run: |
          set -euo pipefail
          WAVE="${{ steps.tag.outputs.wave_id }}"

          # Collect verdict ledger + closure-synthesis + wave-closure files
          # SC2086 fix: use -path with quoted glob (no unquoted $DIR expansion)
          FILES=$(find docs/architecture -maxdepth 3 -type f \( -name "VERDICT-LEDGER.md" -o -name "CLOSURE-SYNTHESIS.md" -o -name "WAVE-CLOSURE.md" -o -name "SYNTHESIS.md" \) -path "docs/architecture/${WAVE}*" 2>/dev/null | sort)

          if [ -z "$FILES" ]; then
            echo "::warning::No wave artifacts found for $WAVE; provenance will cover repo root only"
            FILES="CLAUDE.md .claude/settings.json .mcp.json"
          fi

          # Generate SHA256(file)  filename pairs, then base64-encode each line
          DIGEST_BLOB=""
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              LINE="$(sha256sum "$f")"
              DIGEST_BLOB="${DIGEST_BLOB}${LINE}\n"
            fi
          done <<< "$FILES"
          B64=$(printf '%b' "$DIGEST_BLOB" | base64 -w0)
          echo "digests=$B64" >> "$GITHUB_OUTPUT"

  slsa-provenance:
    name: SLSA L3 generator
    needs: [build-hashes]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0 (W432-CI-STALE-BUMP; was v2.0.0, 761 days stale — NB: slsa-framework v2.1.0 commit is UNSIGNED per gh api verification — accepted per OpenSSF Pinned-Dependencies discipline; SLSA-L3 reusable-workflow integrity preserved via committer GitHub plus base-tag match)
    with:
      base64-subjects: ${{ needs.build-hashes.outputs.digests }}
      upload-assets: true
      # W349 P0.5 RC-11: upload-tag-name required when ref is non-tag head (e.g. PR branch).
      # Without it, SLSA generator's final job exits 27 because SUCCESS=false on empty tag.
      # Cite: slsa-framework/slsa-github-generator v2.0.0 generator_generic_slsa3.yml inputs.
      upload-tag-name: ${{ needs.build-hashes.outputs.tag_name }}
      provenance-name: "claude-sota-installed-${{ needs.build-hashes.outputs.tag_name }}.intoto.jsonl"

  sigstore-tag-sign:
    name: Sigstore signed tag attestation
    needs: [build-hashes]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (W432-CI-STALE-BUMP; was v4.3.1, 191 days stale)
        with: { persist-credentials: false }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign wave artifacts
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          WAVE="${{ needs.build-hashes.outputs.wave_id }}"
          find "docs/architecture/${WAVE}"* -maxdepth 2 -name "WAVE-CLOSURE.md" -print0 2>/dev/null | \
            while IFS= read -r -d '' f; do
              cosign sign-blob --yes "$f" --output-signature "$f.sig" --output-certificate "$f.crt"
            done

      - name: Upload signatures as release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigstore-signatures-${{ needs.build-hashes.outputs.tag_name }}
          path: docs/architecture/W*/*.sig
          if-no-files-found: warn

  cyclonedx-sbom:
    name: CycloneDX SBOM (npm dependency tree)
    needs: [build-hashes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # W368 P0.5 — CycloneDX SBOM generation for L4 supply-chain provenance.
    # Closes W367 Stream F gap #7 (leverage 24.0). Cite: CycloneDX v1.6 spec +
    # OWASP A06:2021 (Vulnerable+Outdated Components) + NIST SP 800-218 PW.7.
    # Uses npx with pinned @cyclonedx/cyclonedx-npm@4.2.1 (no GH Action because
    # SBOM tool is invoked as Node CLI; version-pin discipline lives in npx -p).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (W432-CI-STALE-BUMP; was v4.3.1, 191 days stale)
        with: { persist-credentials: false }

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (W368 P0.5 SHA-pin per CR-1)
        with:
          node-version: '22'

      - name: Install production deps for SBOM scope
        run: npm ci --ignore-scripts
        # --ignore-scripts: supply-chain hardening per W331 axis-1 #3 trust-tuple (d).

      - name: Generate CycloneDX SBOM (JSON, spec 1.6)
        run: |
          set -euo pipefail
          npx -y -p '@cyclonedx/cyclonedx-npm@4.2.1' cyclonedx-npm \
            --output-format JSON \
            --output-file sbom.cdx.json \
            --spec-version 1.6 \
            --omit dev \
            --validate
          # Sanity: surface SBOM size + component count for log audit.
          echo "SBOM size: $(wc -c < sbom.cdx.json) bytes"
          node -e "const s=require('./sbom.cdx.json');console.log('components:',(s.components||[]).length);"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx-${{ needs.build-hashes.outputs.tag_name }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Attach SBOM to GitHub Release (tag-triggered runs)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-hashes.outputs.tag_name }}
        run: |
          set -euo pipefail
          # Use pre-installed gh CLI on ubuntu-latest to avoid 3rd-party action
          # SHA-pin churn (CR-1 trust-tuple). Release is created by slsa-provenance
          # job (upload-assets: true). We attach SBOM as an additional asset.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sbom.cdx.json --clobber
          else
            echo "::warning::Release $TAG not yet created; SBOM remains as workflow artifact"
          fi

  # W434-GITHUB-CICD — Phase B install #1: actions/attest@v4 first-party SLSA attestation.
  # Complements (does NOT replace) the slsa-provenance job above, which uses the L3
  # reusable-workflow slsa-github-generator. This job adds GitHub's NEW first-party
  # attestation API (auto-detects provenance/SBOM/custom modes from inputs) which:
  #   1. Generates SLSA L2+ build provenance via a single in-workflow step
  #      (vs slsa-github-generator's reusable-workflow indirection).
  #   2. Signs via short-lived Sigstore Fulcio cert (public-good Sigstore for
  #      PUBLIC repos, GitHub's private Sigstore instance for PRIVATE/INTERNAL
  #      repos requiring GitHub Enterprise Cloud).
  #   3. Persists attestation to GH attestations API (queryable via `gh attestation
  #      verify` CLI — first-party UX).
  #   4. Supersedes both deprecated `actions/attest-build-provenance` AND
  #      `actions/attest-sbom` (per upstream READMEs flagged WARNING).
  #
  # Cite anchors (3-org-distinct):
  #   * https://github.com/actions/attest README @ v4.1.0 (sha 59d89421af93a897026c735860bf21b6eb4f7b26)
  #   * https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds
  #     — GitHub Inc artifact-attestation establishment guide
  #   * https://slsa.dev/spec/v1.0/provenance — Linux Foundation SLSA build-provenance predicate
  #   * https://github.com/in-toto/attestation/tree/main/spec/v1 — in-toto attestation envelope spec
  #
  # PRIVATE-repo limitation: per actions/attest README "Artifact attestations are
  # available in public repositories for all current GitHub plans. To use artifact
  # attestations in private or internal repositories, you must be on a GitHub
  # Enterprise Cloud plan." This repo is PRIVATE without GHEC — the action would
  # fail with 403 on attestations-API write. We mark `continue-on-error: true`
  # following the same advisory pattern as W349 RC-18 (Trivy SARIF) + RC-19
  # (dependency-review) + RC-25 (CodeQL SARIF) — gracefully degrades until
  # Phase 4 G7 public-mirror publish or GHEC enable (W431 §2.10 step #9).
  attest-build-provenance:
    name: actions/attest@v4 first-party SLSA L2+ attestation (advisory until public/GHEC)
    needs: [build-hashes, cyclonedx-sbom]
    runs-on: ubuntu-latest
    # PRIVATE-repo gap per W349 RC-18/19/25 pattern; flip to false at Phase 4 G7.
    continue-on-error: true
    permissions:
      # Per actions/attest@v4 README "Usage" section — exact 3-permission block.
      id-token: write          # mint OIDC token for Sigstore signing cert
      attestations: write      # persist attestation to GH attestations API
      contents: read           # read repo files for subject hashing
    steps:
      - name: Harden runner (OWASP CICD-SEC-4 — egress audit)
        # https://github.com/step-security/harden-runner/releases/tag/v2.19.3
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4 (W436-GH-PRACTICE-INSTALL bump 2026-05-24; Enterprise-tier-only changelog, no behavioral delta)
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        # https://github.com/actions/checkout/releases/tag/v6.0.2 (W432-CI-STALE-BUMP)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # Re-download the CycloneDX SBOM artifact from cyclonedx-sbom job so we can
      # generate an SBOM-mode attestation against it. The cyclonedx-sbom job
      # uploaded sbom.cdx.json as workflow artifact `sbom-cyclonedx-<tag>`.
      - name: Download CycloneDX SBOM artifact
        # https://github.com/actions/download-artifact/releases/tag/v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-cyclonedx-${{ needs.build-hashes.outputs.tag_name }}
          path: ./sbom-download

      # MODE 1 — SBOM attestation: bind the CycloneDX SBOM as an in-toto
      # attestation against the SBOM file itself. This is the modern replacement
      # for `actions/attest-sbom` (DEPRECATED in favor of `actions/attest`).
      # Cite: actions/attest@v4.1.0 README "SBOM Attestation" example.
      - name: actions/attest@v4 SBOM attestation
        # https://github.com/actions/attest/releases/tag/v4.1.0
        # SHA 59d89421af93a897026c735860bf21b6eb4f7b26 verified via
        # `gh api repos/actions/attest/git/refs/tags/v4.1.0`.
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        id: attest-sbom
        with:
          # subject-path identifies WHAT is being attested. We attest the SBOM
          # itself as a subject (the SBOM's hash is the artifact-of-interest),
          # AND we provide the SBOM CONTENT via sbom-path so the attestation
          # records the SBOM as the predicate of an SPDX/CycloneDX type.
          subject-path: './sbom-download/sbom.cdx.json'
          sbom-path: './sbom-download/sbom.cdx.json'
          show-summary: true   # show attestation in workflow run summary page

      # MODE 2 — SLSA provenance attestation: bind a SLSA build provenance
      # predicate to a release-artifact subject (when slsa-provenance job
      # uploaded assets to the GH release). For wave-closure tags, the release
      # carries the WAVE-CLOSURE.md as canonical wave artifact — we attest its
      # provenance separately from the slsa-github-generator's reusable-workflow
      # provenance (two independent verifiable signatures, defense-in-depth).
      # Cite: actions/attest@v4.1.0 README "Provenance Attestation (Default)" example.
      - name: actions/attest@v4 SLSA provenance attestation (wave-closure docs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        id: attest-provenance
        with:
          # subject-path glob; each matched file becomes one subject in the
          # in-toto attestation envelope. SLSA build provenance predicate is
          # auto-generated when sbom-path + predicate-type are NOT provided.
          subject-path: |
            docs/architecture/W*/WAVE-CLOSURE.md
            docs/architecture/W*/CLOSURE-SYNTHESIS.md
            docs/architecture/W*/VERDICT-LEDGER.md
          show-summary: true

      - name: Attestation summary
        if: always()
        run: |
          {
            echo "## actions/attest@v4 first-party attestation"
            echo ""
            echo "PRIVATE-repo advisory mode: this job currently runs with continue-on-error=true"
            echo "because actions/attest requires GitHub Enterprise Cloud on PRIVATE repos."
            echo "Will flip to PR-blocking at Phase 4 G7 public-mirror publish."
            echo ""
            echo "- SBOM attestation bundle (sha):     ${{ steps.attest-sbom.outputs.bundle-path || 'N/A' }}"
            echo "- Provenance attestation bundle:    ${{ steps.attest-provenance.outputs.bundle-path || 'N/A' }}"
          } >> "$GITHUB_STEP_SUMMARY"
