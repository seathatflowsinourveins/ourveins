name: OpenSSF Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '38 13 * * 1'   # weekly Monday 13:38 UTC
  push:
    branches: [main]
  workflow_dispatch:

# Per https://github.com/ossf/scorecard-action + https://securityscorecards.dev
# OWASP CICD-SEC-7 (Insecure System Configuration) — weekly hygiene scoring.
# Public repo: publish_results: true uploads to security.dev scorecards.

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repo: publish results to https://securityscorecards.dev
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          sarif_file: results.sarif

      - name: Upload artifact (audit trail)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results-${{ github.run_number }}
          path: results.sarif
          retention-days: 90
