name: PR auto-label
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Per W333.5 Stream 2 — actions/labeler@v6 with path-based rules.
# Auto-routes PRs to operator review queues by area.

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by path
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4 (W436-GH-PRACTICE-INSTALL bump 2026-05-24; SHA via gh api refs/tags/v2.19.4)
        with: { egress-policy: audit }

      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9  # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
