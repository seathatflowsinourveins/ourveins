# W432-G3: Standalone SBOM workflow (push-to-main + workflow_dispatch).
#
# Complements (not replaces) provenance.yml's `cyclonedx-sbom` job, which runs
# ONLY on wave-closure tags (`W*-ship-*`, `W*-closure-*`) and uses
# `@cyclonedx/cyclonedx-npm@4.2.1` — npm-tree-only scope.
#
# This workflow:
#   1. Runs on every push to main (continuous SBOM history) + workflow_dispatch
#      (operator on-demand).
#   2. Uses `anchore/sbom-action` (Syft engine) for MULTI-LANGUAGE scope — picks
#      up Python (requirements.txt, pyproject.toml), Node (package.json), Go,
#      Rust, system pkgs. The runtime ships npm-only via provenance.yml but the
#      Z:/claude-sota-installed tree carries tools/*.mjs + harness/*.py + .specify
#      bash + various uvx pkgs — single-tool Syft captures all.
#   3. Generates BOTH CycloneDX v1.6 + SPDX v2.3 JSON (multi-consumer ecosystem
#      support — CycloneDX preferred by OWASP, SPDX preferred by Linux
#      Foundation + NTIA-mandated US-federal procurements).
#   4. Signs SBOMs via cosign keyless OIDC (Sigstore Fulcio) — SLSA-L3
#      trajectory + tamper-detection at the SBOM level.
#   5. Uploads as workflow artifacts (retention 90d for audit trail).
#   6. Attaches to release if push triggers a release-event (handled by
#      provenance.yml's release path; this workflow is non-release-scoped).
#
# Cite anchors:
#   * CycloneDX v1.6 spec: https://cyclonedx.org/docs/1.6/
#   * SPDX v2.3 spec: https://spdx.github.io/spdx-spec/v2.3/
#   * NTIA "Minimum Elements For a Software Bill of Materials" (2021):
#     https://www.ntia.doc.gov/files/ntia/publications/sbom_minimum_elements_report.pdf
#   * Sigstore cosign keyless signing:
#     https://docs.sigstore.dev/cosign/signing/overview/#keyless-signing
#   * OWASP A06:2021 Vulnerable + Outdated Components:
#     https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components/
#   * NIST SP 800-218 PW.7 (Review/Analyze Code) + RV.1 (Identify+Confirm Vulns Ongoing):
#     https://csrc.nist.gov/Projects/ssdf
#   * SLSA L3 build provenance: https://slsa.dev/spec/v1.0/levels#build-l3
#   * anchore/sbom-action README @ v0.24.0:
#     https://github.com/anchore/sbom-action/blob/v0.24.0/README.md
#   * sigstore/cosign-installer README @ v4.1.2:
#     https://github.com/sigstore/cosign-installer/blob/v4.1.2/README.md

name: SBOM (CycloneDX + SPDX, Sigstore-signed)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sbom_format_extra:
        description: 'Extra format override (cyclonedx-json|spdx-json|both)'
        required: false
        default: 'both'
        type: choice
        options: [cyclonedx-json, spdx-json, both]

# OWASP CICD-SEC-2 least-privilege:
#   contents: write — required to upload to release if push matched a tag
#                     (no-op on branch pushes; future-safe).
#   id-token: write — required for Sigstore keyless OIDC (cosign-installer
#                     README "OIDC Token" section).
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # SBOMs are an audit artifact — don't drop completed runs

jobs:
  generate:
    name: Generate + sign SBOM (multi-language Syft scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # cosign keyless
    outputs:
      sbom-cyclonedx-name: ${{ steps.cdx.outputs.fileName }}
      sbom-spdx-name: ${{ steps.spdx.outputs.fileName }}
    steps:
      - name: Harden runner (OWASP CICD-SEC-4 — egress audit)
        # https://github.com/step-security/harden-runner/releases/tag/v2.19.3
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4 (W436-GH-PRACTICE-INSTALL bump 2026-05-24; Enterprise-tier-only changelog, no behavioral delta)
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        # https://github.com/actions/checkout/releases/tag/v4.3.1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0   # full history for accurate Syft package scan

      # ---- SBOM 1: CycloneDX v1.6 (OWASP-preferred) -----------------------------------
      - name: Generate SBOM (CycloneDX 1.6)
        id: cdx
        # https://github.com/anchore/sbom-action/releases/tag/v0.24.0
        # action.yml inputs verified: format, output-file, artifact-name, path, upload-artifact.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx-${{ github.sha }}.json
          # action default `upload-artifact: true` — keep (workflow-artifact 90d).
          # action default `upload-release-assets: true` — no-op on branch pushes.
          # action default `dependency-snapshot: false` — keep (PRIVATE repo without
          # GHAS would 403; matches dependency-review.yml R5 graceful-degrade pattern).

      - name: Verify CycloneDX SBOM structure
        run: |
          set -euo pipefail
          # NTIA minimum elements: supplier, component-name, version, dependency,
          # author, timestamp. CycloneDX 1.6 carries all in metadata + components[].
          test -s sbom.cyclonedx.json || { echo "::error::Empty CycloneDX SBOM"; exit 1; }
          SPEC=$(jq -r '.specVersion // empty' sbom.cyclonedx.json)
          COMPONENTS=$(jq -r '.components | length' sbom.cyclonedx.json)
          echo "CycloneDX specVersion: $SPEC"
          echo "Components scanned:    $COMPONENTS"
          if [ -z "$SPEC" ]; then
            echo "::error::CycloneDX SBOM missing specVersion"
            exit 1
          fi

      # ---- SBOM 2: SPDX v2.3 (LF + NTIA-preferred) -------------------------------------
      - name: Generate SBOM (SPDX 2.3)
        id: spdx
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx-${{ github.sha }}.json

      - name: Verify SPDX SBOM structure
        run: |
          set -euo pipefail
          test -s sbom.spdx.json || { echo "::error::Empty SPDX SBOM"; exit 1; }
          SPDX_VER=$(jq -r '.spdxVersion // empty' sbom.spdx.json)
          PKGS=$(jq -r '.packages | length' sbom.spdx.json)
          echo "SPDX version:    $SPDX_VER"
          echo "Packages scanned: $PKGS"
          if [ -z "$SPDX_VER" ]; then
            echo "::error::SPDX SBOM missing spdxVersion"
            exit 1
          fi

      # ---- Sigstore keyless signing (cosign attest-blob) ------------------------------
      - name: Install cosign
        # https://github.com/sigstore/cosign-installer/releases/tag/v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign SBOMs (Sigstore keyless)
        env:
          # Per cosign-installer README "OIDC Token Issuance" + sigstore docs
          # "Keyless signing > GitHub Actions": COSIGN_YES=true skips interactive
          # confirm; OIDC token is auto-fetched from ${ACTIONS_ID_TOKEN_REQUEST_URL}.
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          for f in sbom.cyclonedx.json sbom.spdx.json; do
            echo "Signing $f via Sigstore Fulcio keyless OIDC ..."
            # cosign sign-blob writes detached signature (.sig) + certificate (.crt).
            # cite: https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
            cosign sign-blob \
              --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.crt" \
              "$f"
            echo "  -> $f.sig + $f.crt"
          done

          # Verify signatures locally (smoke check — prevents silent Fulcio-side
          # failures from shipping unsigned artifacts to release).
          # cite: https://docs.sigstore.dev/cosign/verifying/verify/
          for f in sbom.cyclonedx.json sbom.spdx.json; do
            echo "Verifying $f.sig ..."
            cosign verify-blob \
              --signature "$f.sig" \
              --certificate "$f.crt" \
              --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sbom.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$f"
          done

      # ---- Upload bundled SBOM + signatures as one artifact for audit retrieval -------
      - name: Upload signed SBOM bundle
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-signed-${{ github.sha }}
          path: |
            sbom.cyclonedx.json
            sbom.cyclonedx.json.sig
            sbom.cyclonedx.json.crt
            sbom.spdx.json
            sbom.spdx.json.sig
            sbom.spdx.json.crt
          if-no-files-found: error
          retention-days: 90

      - name: SBOM summary
        if: always()
        run: |
          {
            echo "## SBOM generation + signing summary"
            echo ""
            echo "| Artifact | Format | Status |"
            echo "|---|---|---|"
            echo "| sbom.cyclonedx.json | CycloneDX v1.6 | $([ -s sbom.cyclonedx.json ] && echo OK || echo MISSING) |"
            echo "| sbom.cyclonedx.json.sig | Sigstore detached signature | $([ -s sbom.cyclonedx.json.sig ] && echo OK || echo MISSING) |"
            echo "| sbom.cyclonedx.json.crt | Fulcio cert | $([ -s sbom.cyclonedx.json.crt ] && echo OK || echo MISSING) |"
            echo "| sbom.spdx.json | SPDX v2.3 | $([ -s sbom.spdx.json ] && echo OK || echo MISSING) |"
            echo "| sbom.spdx.json.sig | Sigstore detached signature | $([ -s sbom.spdx.json.sig ] && echo OK || echo MISSING) |"
            echo "| sbom.spdx.json.crt | Fulcio cert | $([ -s sbom.spdx.json.crt ] && echo OK || echo MISSING) |"
          } >> "$GITHUB_STEP_SUMMARY"
