name: CodeQL (SAST)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 5 * * 2'   # weekly Tuesday 05:21 UTC

# Per https://github.com/github/codeql-action + https://codeql.github.com/docs/
# Closes Stream 1 SAST gap (we had SARIF upload but no init+analyze).
# OWASP CICD-SEC-3/7 reinforcement; complements Trivy (SCA) with code-flow analysis (SAST).

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4 (W436-GH-PRACTICE-INSTALL bump 2026-05-24; Enterprise-tier-only changelog, no behavioral delta)
        with: { egress-policy: audit }

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (W432-CI-STALE-BUMP; was v4.3.1, 191 days stale)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5

      # W349 P0.5 RC-25: CodeQL analyze step uploads SARIF to GH Code Scanning,
      # which is gated on GitHub Advanced Security. This repo is PRIVATE without
      # GHAS ($$$), so SARIF upload fails: '##[error]Code scanning is not enabled
      # for this repository. Please enable code scanning in the repository settings.'
      # Failure is preexisting on main (5/5 most-recent CodeQL runs failed on
      # b34ecd2/83b07d6/51e397f/acd46ba/3f5c4c2 per `gh run list --branch main
      # --workflow="CodeQL (SAST)" --limit 5`), NOT introduced by this PR.
      # Pattern mirrors RC-18 (Trivy SARIF) + RC-19 (dependency-review) +
      # RC-24 (lychee) advisory mode. CodeQL still RUNS (databases built +
      # queries executed in SARIF artifacts), just the upload-to-Security-tab
      # step is non-blocking until GHAS enabled or repo goes PUBLIC.
      # Cite: docs.github.com 'About code scanning > Code scanning availability
      # for private repositories' + github/codeql-action#1631 (private-repo
      # SARIF-upload UX).
      - name: Analyze
        continue-on-error: true   # W349 RC-25 (W380-merge re-union): advisory until GHAS enabled or repo PUBLIC
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          category: '/language:${{ matrix.language }}'
