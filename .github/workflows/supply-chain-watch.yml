name: Supply-chain watch (IOC sweep)
on:
  schedule:
    - cron: '15 */6 * * *'   # every 6h at :15
  workflow_dispatch:

# Per W342 Stream X4 §1 (P1.3 ECC port): 6-hourly gitleaks + npm audit + .mcp.json pin-audit
# Source: W341 Stream D §5 (everything-claude-code supply-chain-watch CI template)
# OWASP CICD-SEC-3 (3rd-party dependency abuse) + CR-1(c) malicious-update review

permissions:
  contents: read
  issues: write
  security-events: write

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    name: IOC sweep + open issue on finding
    runs-on: ubuntu-latest
    steps:
      # W381 Stream D §1: SHA-pin straggler (egress-policy:audit retained per Stream A §3 #1 — flip to block needs allowed-endpoints allowlist).
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4 (W436-GH-PRACTICE-INSTALL bump 2026-05-24; Enterprise-tier-only changelog, no behavioral delta)
        with: { egress-policy: audit }

      # W381 Stream D §1: SHA-pin (was @v4; SHA per ci.yml:26).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (W432-CI-STALE-BUMP; was v4.3.1, 191 days stale)
        with:
          persist-credentials: false
          fetch-depth: 0

      # W381 Stream D §1: SHA-pin (was @v2; SHA per ci.yml:100).
      - name: gitleaks scan
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # W381 Stream D §1: SHA-pin (was @v4; SHA per ci.yml:32).
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with: { node-version: '22.22.0' }

      - name: npm audit (HIGH/CRITICAL only)
        id: npmaudit
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm audit --omit=dev --audit-level=high --json > npm-audit.json 2>&1 || true
            high=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('npm-audit.json','utf8'));console.log((j.metadata?.vulnerabilities?.high||0)+(j.metadata?.vulnerabilities?.critical||0))}catch(e){console.log(0)}")
            echo "high_critical=$high" >> "$GITHUB_OUTPUT"
          else
            echo "high_critical=0" >> "$GITHUB_OUTPUT"
          fi

      - name: .mcp.json pin-audit (no @latest)
        id: mcppin
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f .mcp.json ]; then
            unpinned=$(grep -c '@latest' .mcp.json 2>/dev/null || echo 0)
            echo "unpinned=$unpinned" >> "$GITHUB_OUTPUT"
            if [ "$unpinned" -gt 0 ]; then
              echo "::warning::Found $unpinned @latest references in .mcp.json (CR-1 violation; W286-arc-P0C requires @<pinned-version>)"
            fi
          else
            echo "unpinned=0" >> "$GITHUB_OUTPUT"
          fi

      # W381 Stream D §1: SHA-pin (was @v7; SHA per codex-review.yml:72).
      - name: Open issue on finding
        if: ${{ steps.gitleaks.outcome == 'failure' || steps.npmaudit.outputs.high_critical != '0' || steps.mcppin.outputs.unpinned != '0' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0 (W432-CI-STALE-BUMP; was v7.1.0, 351 days stale — verified scripts use injected github + Node-builtin only, no require('@actions/github'))
        with:
          script: |
            const ts = new Date().toISOString();
            const gl = '${{ steps.gitleaks.outcome }}';
            const nh = '${{ steps.npmaudit.outputs.high_critical }}';
            const up = '${{ steps.mcppin.outputs.unpinned }}';
            const body = `# Supply-chain IOC sweep — ${ts}\n\n- gitleaks: ${gl}\n- npm audit HIGH/CRITICAL: ${nh}\n- .mcp.json @latest refs (CR-1 violation): ${up}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n*Auto-generated by .github/workflows/supply-chain-watch.yml*`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[supply-chain-watch] IOC finding — ${ts.slice(0,10)}`,
              body: body,
              labels: ['security', 'supply-chain', 'auto-generated']
            });
