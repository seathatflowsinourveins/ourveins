name: Dependency Review (PR gate)
# Per https://github.com/actions/dependency-review-action
# OWASP CICD-SEC-3 (Dependency-Chain Abuse) — blocks PRs introducing HIGH+ vulns.
# Public repo: full dependency-review API available without GHAS.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: 'AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0'
          comment-summary-in-pr: always
          show-openssf-scorecard: true
