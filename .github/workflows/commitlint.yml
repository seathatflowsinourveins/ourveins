name: Conventional Commits (commitlint)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Per https://www.conventionalcommits.org/en/v1.0.0/ + https://github.com/conventional-changelog/commitlint
# Enforces commit-message discipline: type(scope): subject
# Valid types: feat / fix / docs / style / refactor / perf / test / chore / ci / build

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint (commit-message discipline)
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6.2.1
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        with:
          helpURL: https://www.conventionalcommits.org/en/v1.0.0/
