# .github/labeler.yml — path-based PR label routing
# Per https://github.com/actions/labeler v5 syntax

ci:
  - changed-files:
    - any-glob-to-any-file: '.github/**'

docs:
  - changed-files:
    - any-glob-to-any-file: ['docs/**', '*.md', 'README*']

python:
  - changed-files:
    - any-glob-to-any-file: ['**/*.py', 'pyproject.toml', 'requirements*.txt', 'setup.cfg', 'setup.py']

javascript:
  - changed-files:
    - any-glob-to-any-file: ['**/*.js', '**/*.ts', '**/*.mjs', '**/*.cjs', 'package.json', 'package-lock.json']

tests:
  - changed-files:
    - any-glob-to-any-file: ['tests/**', '**/*_test.py', '**/*.test.*', '**/*.spec.*']

dependencies:
  - changed-files:
    - any-glob-to-any-file: ['**/requirements*.txt', '**/package.json', '**/package-lock.json', '**/pyproject.toml', '.github/dependabot.yml']
