# Path → label mappings for actions/labeler@v6
# Per W333.5 Stream 2 — auto-route PRs by architecture layer.

skills:
  - changed-files:
      - any-glob-to-any-file: ['.claude/skills/**']

mcp:
  - changed-files:
      - any-glob-to-any-file: ['.mcp.json', '.claude/plugins/installed_plugins.json']

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/actions/**'
          - '.github/labeler.yml'
          - '.github/dependabot.yml'
          - '.github/CODEOWNERS'
          - '.pre-commit-config.yaml'

wave:
  - changed-files:
      - any-glob-to-any-file: ['docs/architecture/W*/**']

tools:
  - changed-files:
      - any-glob-to-any-file: ['tools/**']

hooks:
  - changed-files:
      - any-glob-to-any-file: ['.claude/hooks/**']

cardinal-rule-surface:
  - changed-files:
      - any-glob-to-any-file:
          - 'CLAUDE.md'
          - '.claude/settings.json'
          - '.mcp.json'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
      - all-globs-to-all-files:
          - '!docs/architecture/W*/**'   # waves get their own label

dependencies:
  - head-branch: ['^dependabot/.*']
