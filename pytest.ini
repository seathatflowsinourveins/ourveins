[pytest]
asyncio_mode = auto
# W376 PHASE D env-fix: the logfire pytest plugin (entry-point pytest_logfire ->
# logfire._internal.integrations.pytest) imports `ReadableLogRecord` from
# opentelemetry.sdk._logs, which the installed opentelemetry-sdk version does NOT
# export — crashing pytest collection globally + nondeterministically. Disable the
# logfire pytest plugin here (non-invasive; does NOT mutate the shared venv
# Z:\venvs\claude used by sibling/parent runtimes). Proper fix = align
# logfire<->opentelemetry-sdk versions, queued as W377+ operator-sign'd venv task.
addopts = -p no:logfire
markers =
    e2e: real-LLM + Temporal + Docker end-to-end tests (run via `pytest -m e2e`)
