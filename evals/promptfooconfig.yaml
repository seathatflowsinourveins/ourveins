description: |
  eee runtime smoke eval — verify CLIProxyAPI fleet end-to-end via Anthropic
  /v1/messages API. Routes through eee-fleet-key-eval stratified API key (per
  .cli-proxy-api/config.yaml §api-keys[3]).

# Provider — eee's CPA fleet at port 8317 with stratified eval API key
providers:
  - id: anthropic:messages:claude-sonnet-4-6
    label: cpa-fleet-sonnet
    config:
      apiBaseUrl: http://127.0.0.1:8317
      apiKey: eee-fleet-key-eval
      max_tokens: 256

# Trivial smoke prompt — no destructive surface; verifies routing + response
prompts:
  - |-
    Reply with the literal token READY-FOR-EVAL in 1-2 words to confirm the
    request reached the model end-to-end. No other content.

# Test cases
tests:
  - description: smoke — round-trip verification via CPA fleet
    assert:
      - type: contains
        value: READY-FOR-EVAL
      - type: latency
        threshold: 30000
      - type: cost
        threshold: 0.01

# Output config
outputPath: Z:/claude-sota-installed-state/evals/results
