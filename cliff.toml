# git-cliff config — W317-D
# https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from W-wave commit prose ("ship(W317...): ...").
# Groups by W-wave scope so the changelog reads as a wave-arc history.

[changelog]
header = """
# CHANGELOG

All notable W-wave ship commits from W280 → HEAD.
Generated by [git-cliff](https://git-cliff.org/) per W317-D.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`])
{% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false

# Map commit types to changelog sections. `ship` is our custom W-wave type.
commit_parsers = [
  { message = "^ship", group = "Ship (W-wave)" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Docs" },
  { message = "^chore", group = "Chore" },
  { message = "^ci", group = "CI" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  { message = "^revert", group = "Revert" },
  { message = "^style", group = "Style" },
  { message = "^wip", group = "WIP" },
  { message = ".*", group = "Other" },
]

protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
